name: 🚀 Deploy SpotBot

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-spotbot
  cancel-in-progress: true

env:
  DEPLOY_PATH: /home/rizal/spotbot

jobs:
  deploy:
    name: Deploy to Server via Cloudflare Tunnel
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Install cloudflared
        run: |
          curl -fsSL -o /tmp/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          sudo install -m 755 /tmp/cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: 🔑 Setup SSH via Tunnel
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat > ~/.ssh/config <<'EOF'
          Host deploy-target
            HostName ${{ secrets.SSH_HOST }}
            User ${{ secrets.SSH_USER }}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ConnectTimeout 30
            ProxyCommand cloudflared access ssh --hostname %h
          EOF
          chmod 600 ~/.ssh/config

      - name: 🔎 Test Connection
        run: |
          ssh deploy-target "echo 'Connected to' \$(hostname) as \$(whoami)"

      - name: 🚀 Sync latest code
        run: |
          ssh deploy-target "
            set -e
            cd $DEPLOY_PATH
            echo '📥 Pulling latest commits from origin/main...'
            git fetch --depth=1 origin main
            git reset --hard origin/main
            chmod +x deploy.sh
          "

      - name: 🐳 Build & Restart Container
        run: |
          ssh deploy-target "cd $DEPLOY_PATH && bash -x ./deploy.sh"

      - name: 📊 Check Container Status
        run: |
          ssh deploy-target "docker ps --filter name=spotify-connect-discord-bot"

      - name: ✅ Notify Success
        if: success()
        run: |
          {
            echo "## ✅ Deploy SpotBot Berhasil!"
            echo "- **Server**: \`${{ secrets.SSH_HOST }}\`"
            echo "- **Commit**: \`${{ github.sha }}\`"
            echo "- **Waktu**: $(date -u '+%Y-%m-%d %H:%M UTC')"
          } >> "$GITHUB_STEP_SUMMARY"
